
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Village Driving 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#info{position:absolute;top:12px;left:12px;color:white;background:#0009;padding:12px;border-radius:12px;font-weight:bold;z-index:2}
#controls{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:space-around;z-index:3}
button{width:75px;height:65px;border:2px solid white;border-radius:18px;background:#222b;color:white;font-size:25px;touch-action:none}
#gas{background:#168b36cc}
</style>
</head>
<body>
<div id="info">🇮🇳 Indian Village Driving 3D<br><span id="speed">Speed: 0 km/h</span></div>
<div id="controls">
<button id="left">◀</button>
<button id="gas">▲</button>
<button id="right">▶</button>
<button id="brake">▼</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,150);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x567044,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-20,30,15);
sun.castShadow=true;
scene.add(sun);

function material(color){return new THREE.MeshStandardMaterial({color,roughness:.85})}
const green=material(0x398b35),road=material(0x444444);
const brown=material(0x9a6037),roof=material(0x9c3825);

function block(w,h,d,x,y,z,m){
const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
scene.add(o);return o;
}

block(200,.2,200,0,-.2,0,green);
block(8,.12,200,0,0,0,road);
for(let z=-95;z<100;z+=9){
block(.16,.03,3,0,.08,z,material(0xffffff));
}

// Village houses
for(let i=0;i<24;i++){
let x=(i%2?1:-1)*(9+Math.random()*13);
let z=-90+i*8;
block(5,3.5,5,x,1.75,z,brown);
const r=new THREE.Mesh(new THREE.ConeGeometry(4.2,2.5,4),roof);
r.position.set(x,4.7,z);r.rotation.y=Math.PI/4;
r.castShadow=true;scene.add(r);
block(1.1,2, .12,x,1,z-2.56,material(0x49301d));
block(.9,.9,.15,x+1.4,2,z-2.6,material(0x8bd4e8));
}

// Trees
for(let i=0;i<65;i++){
let x=(Math.random()<.5?-1:1)*(9+Math.random()*35);
let z=Math.random()*190-95;
block(.45,2,.45,x,1,z,material(0x704326));
const leaves=new THREE.Mesh(new THREE.SphereGeometry(1.8,8,7),material(0x17652a));
leaves.position.set(x,3,z);leaves.castShadow=true;scene.add(leaves);
}

// SUV
const car=new THREE.Group();
scene.add(car);
block(2.5,.65,4,0,.85,0,material(0x1b7b32)).parent=car;
block(2.1,1.05,2.1,0,1.65,-.25,material(0x187a35)).parent=car;
block(1.85,.8,1.95,0,1.7,-.25,material(0x9bcbdc)).parent=car;
block(2.3,.22,.15,0,1.05,-2.05,material(0x222222)).parent=car;

const wheels=[];
for(let x of [-1.25,1.25]){
for(let z of [-1.3,1.3]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.28,20),material(0x171717));
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,.55,z);wheel.castShadow=true;
car.add(wheel);wheels.push(wheel);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.3,16),material(0xaaaaaa));
hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);car.add(hub);
}}
car.position.set(0,0,3);

let speed=0,steer=0;
const keys={};
function bind(id,key){
const b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});
['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));
}
bind('gas','gas');bind('brake','brake');bind('left','left');bind('right','right');
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function animate(){
requestAnimationFrame(animate);
if(keys.gas||keys.arrowup||keys.w)speed=Math.min(speed+.012,.65);
else speed*=.985;
if(keys.brake||keys.arrowdown||keys.s)speed=Math.max(0,speed-.035);
if(keys.left||keys.arrowleft||keys.a)steer=Math.min(steer+.035,.55);
else if(keys.right||keys.arrowright||keys.d)steer=Math.max(steer-.035,-.55);
else steer*=.9;

car.rotation.y+=steer*speed*.055;
car.position.x-=Math.sin(car.rotation.y)*speed;
car.position.z-=Math.cos(car.rotation.y)*speed;
car.position.x=Math.max(-3.2,Math.min(3.2,car.position.x));
wheels.forEach(w=>w.rotation.x+=speed*.12);

camera.position.x+=(car.position.x-camera.position.x)*.08;
camera.position.z+=(car.position.z+9-camera.position.z)*.08;
camera.lookAt(car.position.x,1,car.position.z-5);
document.getElementById('speed').textContent='Speed: '+Math.round(speed*160)+' km/h';
renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
